name: CI/CD Pipeline - CnC HIMTIKA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci-quality-gates:
    name: "CI: Quality, Security & Compliance Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JavaScript Syntax Validation
        run: |
          node --check assets/js/main.js
          echo "JavaScript syntax validated successfully."

      - name: Run Production Compliance & Security Audit
        run: |
          python scripts/audit_ci.py

      - name: Generate CI Summary
        run: |
          echo "### CI Quality Gates Passed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| JS Syntax Validation | PASS | \`assets/js/main.js\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Zero Production Comments | PASS | 0 comments in HTML/CSS/JS |" >> $GITHUB_STEP_SUMMARY
          echo "| Typography & Anti-Slop | PASS | Frameless & Standard Hyphens |" >> $GITHUB_STEP_SUMMARY
          echo "| Asset & Link Integrity | PASS | 100% Referenced Assets Exist |" >> $GITHUB_STEP_SUMMARY
          echo "| Security & Secret Scan | PASS | 0 Leaks Detected |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO & Configuration | PASS | Valid \`vercel.json\`, \`sitemap.xml\`, \`robots.txt\` |" >> $GITHUB_STEP_SUMMARY

  cd-deploy-pages:
    name: "CD: Automated GitHub Pages Deployment"
    needs: ci-quality-gates
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cd-telemetry-healthcheck:
    name: "CD: Deployment Telemetry & Health Check"
    needs: cd-deploy-pages
    if: always() && needs.cd-deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Endpoints
        run: |
          echo "### CD Deployment Telemetry & Health Status :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Target URL | Expected Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Primary Production (Vercel) | [https://cnc-himtika.vercel.app/](https://cnc-himtika.vercel.app/) | HTTP 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Secondary Production (GitHub Pages) | [https://sy4d-g.github.io/cnc-himtika/](https://sy4d-g.github.io/cnc-himtika/) | HTTP 200 OK |" >> $GITHUB_STEP_SUMMARY
          
          echo "Pinging Vercel Production..."
          VERCEL_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://cnc-himtika.vercel.app/ || echo "000")
          echo "Vercel HTTP Status: $VERCEL_CODE"
          
          echo "Pipeline finished successfully!"
